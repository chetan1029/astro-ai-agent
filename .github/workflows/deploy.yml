name: CI/CD Pipeline

env:
  SERVICE_NAME: astro-ai-agent-service
  PROJECT_ID: astro-ai-agent

on:
  pull_request:
    branches: [ "main" ]   # Run CI for PRs to main
  push:
    branches: [ "main" ]   # Run CI after merge into main
  release:
    types: [created]       # Deploy only on release creation (e.g., v1.0.0 tag)

jobs:
  # ------------------------
  # 1. Linting & Testing Job
  # ------------------------
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Run Ruff (lint + formatting check)
        run: |
          ruff check .
          ruff format .
#      - name: Run tests
#        run: pytest --maxfail=1 --disable-warnings -q

  # ------------------------
  # 2. Deployment Job (on release)
  # ------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'release'
    steps:
      # Step 1: Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Google Cloud Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Step 2: Set up Google Cloud SDK
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ secrets.GKE_ZONE }}-docker.pkg.dev --quiet

      # Step 3: Build & Push Docker image to Artifact Registry
      - name: Build & push Docker image
        run: |
          TAG=${{ github.event.release.tag_name }}
          IMAGE="${{ secrets.GKE_ZONE }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/astro-ai-agent-repo/astro-ai-agent-app:$TAG"
          echo "Building image with tag $TAG..."
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # Step 4: Authenticate kubectl with GKE
      - name: Get GKE credentials
        run: |
          export USE_GKE_GCLOUD_AUTH_PLUGIN=True
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
            --zone ${{ secrets.GKE_ZONE }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # Step 5: Set namespace (optional)
      - name: Create namespace if not exists
        run: |
          kubectl get ns ${{ secrets.K8S_NAMESPACE }} || kubectl create ns ${{ secrets.K8S_NAMESPACE }}

      # Step 6: Deploy FastAPI (update image dynamically)
      - name: Update deployment image and rollout
        run: |
          TAG=${{ github.event.release.tag_name }}
          kubectl -n ${{ secrets.K8S_NAMESPACE }} set image deployment/astro-agent \
            astro-agent=$IMAGE
          kubectl -n ${{ secrets.K8S_NAMESPACE }} rollout status deploy/astro-agent
          

#      # Step 5: Deploy FastAPI app
#      - name: Deploy FastAPI
#        run: |
#          kubectl -n ${{ secrets.K8S_NAMESPACE }} apply -f k8s/app/deployment.yaml
#          kubectl -n ${{ secrets.K8S_NAMESPACE }} apply -f k8s/app/service.yaml


#      # Step 6: Wait for rollout
#      - name: Wait for FastAPI rollout
