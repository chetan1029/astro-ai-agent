name: CI/CD Pipeline

on:
  pull_request:
    branches: [ "main" ]   # Run CI for PRs to main
  push:
    branches: [ "main" ]   # Run CI after merge into main
  release:
    types: [created]       # Deploy only on release creation (e.g., v1.0.0 tag)

jobs:
  # ------------------------
  # 1. Linting & Testing Job
  # ------------------------
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run Ruff (lint + formatting check)
        run: |
          ruff check .
          ruff format .

#      - name: Run tests
#        run: pytest --maxfail=1 --disable-warnings -q

  # ------------------------
  # 2. Deployment Job (on release)
  # ------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v3

      # Authenticate with GCP
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      # Configure Docker to push to Artifact Registry
      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      # Build & Push Docker Image (tagged with release version)
      - name: Build and Push
        run: |
          VERSION=${{ github.event.release.tag_name }}
          IMAGE="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/astro-ai-repo/my-service:$VERSION"
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # Deploy to Cloud Run (no secrets, reuse existing service config)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy my-service \
            --image $IMAGE \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated