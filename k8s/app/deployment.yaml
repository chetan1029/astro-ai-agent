apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astro-agent
  template:
    metadata:
      labels:
        app: astro-agent
    spec:
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done; echo "PostgreSQL is up."' ]
      containers:
        - name: astro-agent
          image: astro-agent
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: astro-config
            - secretRef:
                name: astro-secret
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck/db
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
